version: '3.9'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: coworking_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: coworking_db
      MYSQL_USER: cowork_user
      MYSQL_PASSWORD: cowork_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Node.js Application
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: coworking_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: cowork_user
      DB_PASSWORD: cowork_pass
      DB_NAME: coworking_db
      JWT_SECRET: change_this_in_production_jwt_secret
      AES_SECRET_KEY: change_this_in_production_32chr!
      BOOKING_EXPIRE_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../:/app
      - /app/node_modules

volumes:
  db_data:
