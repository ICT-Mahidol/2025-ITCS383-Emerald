<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CoWork Space</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-big">🏢</div>
        <h1>CoWork Space</h1>
        <p>Your modern co-working booking system</p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <div id="form-login">
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required>
            <div class="form-error" id="login-email-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
            <div class="form-error" id="login-password-error"></div>
          </div>
          <div id="login-alert"></div>
          <button type="submit" class="btn btn-primary w-full btn-lg" id="login-btn">Sign In</button>
        </form>
        <p class="text-center text-muted mt-2">
          Don't have an account? <a href="#" onclick="switchTab('register')">Register here</a>
        </p>
        <div class="mt-2" style="background:#F0F4FF;border-radius:8px;padding:0.85rem;font-size:0.82rem;color:#546E7A;">
          <strong>Demo Accounts:</strong><br>
          👔 Manager: manager@cowork.com / Manager@123<br>
          👷 Employee: employee@cowork.com / Employee@123<br>
          👤 Customer: customer@cowork.com / Customer@123
        </div>
      </div>

      <!-- Register Form -->
      <div id="form-register" style="display:none">
        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="reg-fname">First Name</label>
              <input type="text" id="reg-fname" class="form-control" placeholder="John" required>
              <div class="form-error" id="reg-fname-error"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-lname">Last Name</label>
              <input type="text" id="reg-lname" class="form-control" placeholder="Doe" required>
              <div class="form-error" id="reg-lname-error"></div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="you@example.com" required>
            <div class="form-error" id="reg-email-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="0812345678" required>
            <div class="form-error" id="reg-phone-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-address">Address</label>
            <input type="text" id="reg-address" class="form-control" placeholder="123 Main St, Bangkok" required>
            <div class="form-error" id="reg-address-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-password">Password <span class="text-muted">(min 8 chars)</span></label>
            <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="8">
            <div class="form-error" id="reg-password-error"></div>
          </div>
          <div id="register-alert"></div>
          <button type="submit" class="btn btn-primary w-full btn-lg" id="register-btn">Create Account</button>
        </form>
        <p class="text-center text-muted mt-2">
          Already have an account? <a href="#" onclick="switchTab('login')">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) {
      const user = Auth.getUser();
      const map  = { customer: '/pages/customer.html', employee: '/pages/employee.html', manager: '/pages/manager.html' };
      window.location.href = map[user?.role] || '/';
    }

    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('form-login').style.display    = tab === 'login'    ? '' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn   = document.getElementById('login-btn');
      const alert = document.getElementById('login-alert');
      alert.innerHTML = '';
      setLoading(btn, true);
      const email    = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      try {
        const res = await API.login({ email, password });
        if (res.success) {
          Auth.setToken(res.token);
          Auth.setUser(res.user);
          showToast('Welcome back, ' + res.user.firstName + '!', 'success');
          const map = { customer: '/pages/customer.html', employee: '/pages/employee.html', manager: '/pages/manager.html' };
          setTimeout(() => window.location.href = map[res.user.role] || '/', 800);
        } else {
          alert.innerHTML = `<div class="alert alert-danger">${res.message || 'Login failed'}</div>`;
        }
      } catch (err) {
        alert.innerHTML = `<div class="alert alert-danger">Connection error. Please try again.</div>`;
      }
      setLoading(btn, false);
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn   = document.getElementById('register-btn');
      const alert = document.getElementById('register-alert');
      alert.innerHTML = '';
      setLoading(btn, true);
      const body = {
        firstName: document.getElementById('reg-fname').value,
        lastName:  document.getElementById('reg-lname').value,
        email:     document.getElementById('reg-email').value,
        phone:     document.getElementById('reg-phone').value,
        address:   document.getElementById('reg-address').value,
        password:  document.getElementById('reg-password').value,
      };
      try {
        const res = await API.register(body);
        if (res.success) {
          alert.innerHTML = `<div class="alert alert-success">Account created! Please sign in.</div>`;
          setTimeout(() => switchTab('login'), 1500);
        } else {
          const msg = res.errors ? res.errors.map(e => e.message).join(', ') : res.message;
          alert.innerHTML = `<div class="alert alert-danger">${msg}</div>`;
        }
      } catch {
        alert.innerHTML = `<div class="alert alert-danger">Connection error. Please try again.</div>`;
      }
      setLoading(btn, false);
    }
  </script>
</body>
</html>
